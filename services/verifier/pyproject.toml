[project]
name = "hendingar-verifier"
version = "0.1.0"
description = "Poster extraction and agentic verification for hendingar.no, on Azure AI Foundry."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Microsoft Agent Framework. `core` is the Agent and the workflow graph, `openai` the chat
    # client that reaches Azure AI Foundry with an Entra credential, `orchestrations` the
    # multi-agent builders. See docs/decisions/0016-agent-framework.md.
    #
    # Held below 1.20 / 1.15 since 2026-10-02. Those two were published at 12:41 UTC that day and
    # broke every streaming test in this service within the hour — `_chat_completion_client.py`
    # does `async with await client.chat.completions.create(...)`, which raises
    # `TypeError: 'async_generator' object does not support the asynchronous context manager
    # protocol`. 24 of 202 tests fail, and the submission path answers an `error` frame where the
    # draft should be.
    #
    # It is not the OpenAI SDK moving underneath them: with these two held and `openai` at the
    # newest 3.23.0, all 202 pass. Measured both ways before writing the bound.
    #
    # To lift it: raise the ceiling, run `pytest -q` in this directory, and keep the change if it
    # is green. Nothing here depends on the new versions.
    "agent-framework-core>=1.18,<1.20",
    "agent-framework-openai>=1.14,<1.15",
    "agent-framework-orchestrations>=1.1",
    # Reached through the framework rather than directly, but it is what the wire types are and
    # what the tests construct their fake responses from, so the floor is ours to state.
    "openai>=1.60",
    "azure-identity>=1.19",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
verifier = "verifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verifier"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
