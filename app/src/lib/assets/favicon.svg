<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="hendingar.no">
	<title>hendingar.no</title>
	<!--
		Two crossed ellipses: many calendars, one place.

		Drawn for 16px, which is the only size that matters for a favicon and the reason this is not
		the poster mark. The landing art it comes from has a dot grid and hairline strokes; at 16px a
		hairline aliases to nothing and the dots fall below a pixel each, so both are dropped and the
		stroke is heavy enough to survive. Padded off the edges: a wider version touched the tile and
		read as a blob rather than two rings.

		The colours are the literal values of the navy-900 and peach brand tokens. An asset cannot
		read a CSS custom property, so this is the one place a colour literal is unavoidable.

		Note for the next person editing this comment: an XML comment may not contain two hyphens in
		a row, so the tokens are named in prose. Writing them with their leading dashes makes the
		file invalid, and a browser renders exactly nothing with no error worth the name.
	-->
	<rect width="32" height="32" fill="#16223b" />
	<g fill="none" stroke="#f7a98a" stroke-width="2.8">
		<ellipse cx="16" cy="16" rx="12.2" ry="6.8" />
		<ellipse cx="16" cy="16" rx="6.8" ry="12.2" />
	</g>
</svg>
