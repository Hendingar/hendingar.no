name: Deploy (dev)

on:
  workflow_dispatch:
  # Gated on CI rather than triggered by push: a merge that breaks `pnpm verify` must not reach
  # the running environment just because the smoke test happens to pass.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write # OIDC federated credential — no stored Azure credentials
  contents: read

env:
  RG: rg-hendingar-swc-dev
  APP: hendingar
  ENV_NAME: dev

# One-time prerequisites (see infra/BOOTSTRAP.md):
#   1. secret POSTGRES_ADMIN_PASSWORD is set
#   2. the runtime identity id-hendingar has AcrPull — the CI principal is only Contributor, and
#      Contributor cannot create role assignments
#   3. the same identity has 'Cognitive Services OpenAI User' on the AI account. Without it the
#      verifier deploys and answers /health, but every model call 401s and every submission
#      routes to the human queue. The app still works; the photo shortcut does not.
jobs:
  deploy:
    # workflow_run fires on failure too; only deploy green commits.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `workflow_run` is already pinned to main, but `workflow_dispatch` accepts any ref — so
      # without this, a dev branch could be deployed to the environment hendingar.no serves by
      # picking it from a dropdown. Iterating on a branch must never be able to reach Azure.
      - name: Refuse to deploy anything but main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploy runs from main only — this ref is ${{ github.ref }}."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Platform only. This template contains no Container App, so converging it can never change
      # what the live app is running.
      - name: Deploy platform
        id: infra
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name "platform-${{ github.run_id }}" \
            --template-file infra/main.bicep \
            --parameters appName="$APP" env="$ENV_NAME" \
              postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --query properties.outputs -o json > outputs.json
          for k in acrName acrLoginServer postgresFqdn postgresAdminUserOut managedEnvironmentId \
                   runtimeIdentityId runtimeIdentityClientId openAiEndpoint openAiDeployment \
                   postersContainerUrl; do
            echo "$k=$(jq -r ".$k.value" outputs.json)" >> "$GITHUB_OUTPUT"
          done

      # Built inside ACR, so the runner needs no registry data-plane rights at all.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ steps.infra.outputs.acrName }}" \
            --image "hendingar:${{ github.sha }}" \
            --image "hendingar:latest" \
            --file Dockerfile .

      - name: Build verifier image in ACR
        run: |
          az acr build \
            --registry "${{ steps.infra.outputs.acrName }}" \
            --image "hendingar-verifier:${{ github.sha }}" \
            --image "hendingar-verifier:latest" \
            --file services/verifier/Dockerfile services/verifier

      # The Postgres firewall allows Azure services only, and a GitHub runner is not one.
      - name: Open firewall for this runner
        id: fw
        run: |
          PG_SERVER="${{ steps.infra.outputs.postgresFqdn }}"
          PG_SERVER="${PG_SERVER%%.*}"
          echo "server=$PG_SERVER" >> "$GITHUB_OUTPUT"
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az postgres flexible-server firewall-rule create \
            --resource-group "$RG" --server-name "$PG_SERVER" \
            --name "gh-runner-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" >/dev/null

      - name: Apply database migrations
        env:
          PGHOST: ${{ steps.infra.outputs.postgresFqdn }}
          PGUSER: ${{ steps.infra.outputs.postgresAdminUserOut }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile

          # Expand/contract, checked again here rather than trusted from CI.
          #
          # Migrations are applied BEFORE the new revision is healthy, so for a window the OLD code
          # runs against the NEW schema. That is safe only while every migration is additive. CI
          # already gates this on every PR; repeating it costs a second and means a migration can
          # never reach the database because someone merged past a red check or dispatched by hand.
          # Failing here leaves the database untouched — the one state we can always recover from.
          pnpm --filter @hendingar/core exec vitest run test/migration-safety.test.ts
          # Build the URL in python so special characters in the password are percent-encoded, and
          # take the username from the deployment output rather than hardcoding it.
          DATABASE_URL=$(PW="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" python3 -c \
            'import os,urllib.parse as u; print("postgres://%s:%s@%s:5432/hendingar?sslmode=require" % (u.quote(os.environ["PGUSER"], safe=""), u.quote(os.environ["PW"], safe=""), os.environ["PGHOST"]))')
          export DATABASE_URL
          pnpm db:migrate
          # Reference data, not schema: the sources we link to but do not collect. Registered on
          # every deploy so the list in packages/core is the single place they are edited, and
          # deliberately a no-op for any slug an importer has since taken over.
          pnpm db:sources

      # A separate always() step, not a bash `trap`: an EXIT trap does not run on SIGKILL, which is
      # what a cancelled run or a runner timeout delivers. A leaked rule leaves a recycled public
      # runner IP allowed against the database.
      - name: Close firewall
        if: always() && steps.fw.outputs.server != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RG" --server-name "${{ steps.fw.outputs.server }}" \
            --name "gh-runner-${{ github.run_id }}" --yes >/dev/null 2>&1 || true
          # Sweep anything an earlier killed run left behind.
          for stale in $(az postgres flexible-server firewall-rule list \
                --resource-group "$RG" --server-name "${{ steps.fw.outputs.server }}" \
                --query "[?starts_with(name,'gh-runner-')].name" -o tsv); do
            echo "removing stale rule $stale"
            az postgres flexible-server firewall-rule delete \
              --resource-group "$RG" --server-name "${{ steps.fw.outputs.server }}" \
              --name "$stale" --yes >/dev/null 2>&1 || true
          done

      # Before the app, because the app needs its internal URL. Internal ingress means this URL
      # only resolves from inside the Container Apps environment — it is not a public endpoint.
      - name: Deploy verifier
        id: verifier
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name "verifier-${{ github.run_id }}" \
            --template-file infra/verifier.bicep \
            --parameters appName="$APP" env="$ENV_NAME" \
              containerImage="${{ steps.infra.outputs.acrLoginServer }}/hendingar-verifier:${{ github.sha }}" \
              acrLoginServer="${{ steps.infra.outputs.acrLoginServer }}" \
              managedEnvironmentId="${{ steps.infra.outputs.managedEnvironmentId }}" \
              runtimeIdentityId="${{ steps.infra.outputs.runtimeIdentityId }}" \
              runtimeIdentityClientId="${{ steps.infra.outputs.runtimeIdentityClientId }}" \
              openAiEndpoint="${{ steps.infra.outputs.openAiEndpoint }}" \
              openAiDeployment="${{ steps.infra.outputs.openAiDeployment }}" \
            --query properties.outputs -o json > verifier-outputs.json
          echo "url=$(jq -r .verifierUrl.value verifier-outputs.json)" >> "$GITHUB_OUTPUT"

      # Read the custom domains BEFORE deploying, so the template can hand them straight back.
      #
      # ARM removes what a template does not declare. The first deploy after hendingar.no, www and
      # dev were bound unbound all three: the certificates survived in the environment, but the app
      # stopped answering on every name a visitor actually uses — and the deploy reported success,
      # because the smoke test only ever hit the default azurecontainerapps.io FQDN.
      - name: Capture bound custom domains
        id: domains
        run: |
          az containerapp show --name "ca-$APP-$ENV_NAME" --resource-group "$RG" \
            --query 'properties.configuration.ingress.customDomains' -o json > domains.raw.json 2>/dev/null \
            || echo 'null' > domains.raw.json
          # `null` (no app yet, or nothing bound) becomes []; the template reads empty as "leave alone".
          jq 'if . == null then [] else . end' domains.raw.json > domains.json
          echo "count=$(jq 'length' domains.json)" >> "$GITHUB_OUTPUT"
          echo "first=$(jq -r '[.[].name] | first // empty' domains.json)" >> "$GITHUB_OUTPUT"
          echo "bound: $(jq -r '[.[].name] | join(", ")' domains.json)"

      - name: Deploy application
        id: app
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name "app-${{ github.run_id }}" \
            --template-file infra/app.bicep \
            --parameters appName="$APP" env="$ENV_NAME" \
              containerImage="${{ steps.infra.outputs.acrLoginServer }}/hendingar:${{ github.sha }}" \
              acrLoginServer="${{ steps.infra.outputs.acrLoginServer }}" \
              managedEnvironmentId="${{ steps.infra.outputs.managedEnvironmentId }}" \
              runtimeIdentityId="${{ steps.infra.outputs.runtimeIdentityId }}" \
              postgresFqdn="${{ steps.infra.outputs.postgresFqdn }}" \
              postgresAdminUser="${{ steps.infra.outputs.postgresAdminUserOut }}" \
              postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
              verifierUrl="${{ steps.verifier.outputs.url }}" \
              posterContainerUrl="${{ steps.infra.outputs.postersContainerUrl }}" \
              customDomains="$(cat domains.json)" \
            --query properties.outputs -o json > app-outputs.json
          echo "url=$(jq -r .appUrl.value app-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .containerAppName.value app-outputs.json)" >> "$GITHUB_OUTPUT"

      # Asserts real behaviour, not just a 200. /health touches the database, and the page must
      # actually contain rendered content — the app serves 200 with the database unreachable, so a
      # status-code check reported success for a broken deployment.
      - name: Smoke test
        run: |
          URL="${{ steps.app.outputs.url }}"
          ok=0
          for i in $(seq 1 30); do
            health=$(curl -s --max-time 15 "$URL/health" || true)
            if printf '%s' "$health" | grep -q '"database":"ok"'; then
              echo "health ok on attempt $i"
              ok=1
              break
            fi
            echo "attempt $i: $health"
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::$URL/health never reported a reachable database"
            az containerapp logs show --name "${{ steps.app.outputs.name }}" \
              --resource-group "$RG" --tail 50 --type console || true
            exit 1
          fi

          body=$(curl -fsS --max-time 20 "$URL/")
          for needle in 'Kva skjer' 'id="innhald"'; do
            printf '%s' "$body" | grep -q "$needle" || {
              echo "::error::response did not contain '$needle' — the app is up but not rendering"
              exit 1
            }
          done

          # A bound hostname, not just the default FQDN. Visitors arrive on hendingar.no; a deploy
          # that unbinds it leaves the *.azurecontainerapps.io URL answering perfectly while the
          # real site is dark. That exact failure shipped once and this step is why it cannot again.
          HOST="${{ steps.domains.outputs.first }}"
          if [ -n "$HOST" ]; then
            echo "checking bound hostname https://$HOST/"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "https://$HOST/" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::error::https://$HOST/ returned $code — the custom domain is not serving."
              echo "Bound now: $(az containerapp show --name "${{ steps.app.outputs.name }}" \
                --resource-group "$RG" \
                --query 'properties.configuration.ingress.customDomains[].name' -o tsv || true)"
              exit 1
            fi
            echo "custom domain ok"
          else
            echo "no custom domain bound — skipping hostname check"
          fi
          echo "content ok"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy (dev)"
            echo ""
            echo "- App: ${{ steps.app.outputs.url }}"
            echo "- Image: \`hendingar:${{ github.sha }}\`"
            echo "- Verifier (internal): \`${{ steps.verifier.outputs.url }}\`"
            echo "- Postgres: \`${{ steps.infra.outputs.postgresFqdn }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
