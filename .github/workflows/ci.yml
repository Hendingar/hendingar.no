name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same command contributors and agents run locally. If this passes, it's green.
      # No network, no database — see docs/decisions/0004-deterministic-importers.md.
      - run: pnpm verify

  verifier:
    runs-on: ubuntu-latest
    # The verification service is Python, so `pnpm verify` cannot see it. Its tests are hermetic in
    # the same sense as the rest: no Azure, no network, no model call — a stub client is injected.
    # test_contract.py reads packages/core/src/verification.ts, which is why it runs from the repo
    # root checkout rather than in isolation.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: services/verifier
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: services/verifier
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        working-directory: services/verifier
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    # The e2e suite asserts server-rendered events and a /health endpoint that touches the
    # database, so it needs a real Postgres. Locally that's Apple `container` (ADR 0006); on Linux
    # CI a service container is the equivalent.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: hendingar
          POSTGRES_PASSWORD: hendingar
          POSTGRES_DB: hendingar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hendingar -d hendingar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hendingar:hendingar@localhost:5433/hendingar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # The sources we link to but do not collect. They are reference data rather than schema, so
      # nothing else creates them — without this the e2e job runs against a database that has no
      # linked sources at all, and every spec covering them fails here while passing on a laptop
      # where someone happened to run it by hand.
      - run: pnpm db:sources
      - run: pnpm --filter @hendingar/app test:e2e:install
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
