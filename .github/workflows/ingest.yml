name: Ingest (dev)

on:
  schedule:
    # 05:00 UTC daily — 07:00 in Norway during summer time, 06:00 in winter. Chosen so a run has
    # finished well before anyone is looking for what's on today.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Map and count without writing
        type: boolean
        default: false

concurrency:
  group: ingest-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RG: rg-hendingar-swc-dev

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Same guard as the deploy, and this one matters more.
      #
      # `schedule` always runs the default branch, but `workflow_dispatch` accepts any ref — so
      # without this, a branch's half-written mapper could be run against the PRODUCTION database
      # from a dropdown, writing real rows. The deploy at least passes through CI first; an ingest
      # writes immediately, and a bad upsert is not undone by redeploying.
      - name: Refuse to ingest from anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Ingest runs from main only — this ref is $GITHUB_REF."
            echo "To try importer changes, run them locally against your own database:"
            echo "  pnpm db:bootstrap && pnpm ingest --dry-run"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the database
        id: pg
        run: |
          FQDN=$(az postgres flexible-server list --resource-group "$RG" \
            --query "[0].fullyQualifiedDomainName" -o tsv)
          test -n "$FQDN" || { echo "::error::no Postgres server in $RG"; exit 1; }
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "server=${FQDN%%.*}" >> "$GITHUB_OUTPUT"

      # The firewall allows Azure services only, and a GitHub runner is not one.
      - name: Open firewall for this runner
        id: fw
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az postgres flexible-server firewall-rule create \
            --resource-group "$RG" --server-name "${{ steps.pg.outputs.server }}" \
            --name "gh-ingest-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" >/dev/null
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # The app's ingress, for the kurator call at the end. The verifier is internal-only, so the
      # app makes the model call and the job asks the app (ADR 0018).
      - name: Resolve the app
        id: app
        run: |
          APP=$(az containerapp show --resource-group "$RG" --name ca-hendingar-dev \
            --query "properties.configuration.ingress.fqdn" -o tsv || true)
          if [ -n "$APP" ]; then
            echo "kurator=https://$APP/api/kurator" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no app ingress found; the job will skip curation"
          fi

      # The whole night is one command: await migrations, every importer, expire, consolidate,
      # the kurator — packages/core/scripts/ingest-job.ts holds the order and the "keep going
      # after a failure" rules that used to be five steps of `if: always()` here. It writes an
      # `ingest_jobs` row, which is how /datasamling can say a night failed — or never ran.
      #
      # It still waits for the deploy's migrations rather than applying them: GitHub fires the
      # 05:00 cron hours late, into the window when merges deploy (see scripts/await-migrations.ts).
      # And it still exits non-zero when any source failed, so a bad night stays a red job.
      - name: Collect every source
        if: steps.fw.outputs.opened == 'true'
        env:
          PGHOST: ${{ steps.pg.outputs.fqdn }}
          # As environment, never pasted into the script: a quote in the value would be shell.
          PW: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          INGEST_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          INGEST_REVISION: ${{ github.sha }}
          KURATOR_URL: ${{ steps.app.outputs.kurator }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DATABASE_URL=$(python3 -c \
            'import os,urllib.parse as u; print("postgres://hendingar:%s@%s:5432/hendingar?sslmode=require" % (u.quote(os.environ["PW"], safe=""), os.environ["PGHOST"]))')
          export DATABASE_URL
          # Without pipefail the step takes `tee`'s exit code: on 2026-10-13 both DNT sources
          # failed and the run was green.
          set -o pipefail
          if [ "$DRY_RUN" = "true" ]; then
            pnpm ingest:job --dry-run | tee -a result.txt
          else
            pnpm ingest:job | tee -a result.txt
          fi

      # A separate always() step: a bash EXIT trap does not survive SIGKILL, and a leaked rule
      # leaves a recycled public runner IP allowed against the database.
      - name: Close firewall
        if: always() && steps.fw.outputs.opened == 'true'
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RG" --server-name "${{ steps.pg.outputs.server }}" \
            --name "gh-ingest-${{ github.run_id }}" --yes >/dev/null 2>&1 || true
          for stale in $(az postgres flexible-server firewall-rule list \
                --resource-group "$RG" --server-name "${{ steps.pg.outputs.server }}" \
                --query "[?starts_with(name,'gh-ingest-')].name" -o tsv); do
            az postgres flexible-server firewall-rule delete \
              --resource-group "$RG" --server-name "${{ steps.pg.outputs.server }}" \
              --name "$stale" --yes >/dev/null 2>&1 || true
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ingest (dev)"
            echo ""
            echo '```'
            cat result.txt 2>/dev/null || echo "no result — the run did not reach the importer"
            echo '```'
            echo ""
            echo "Status board: https://ca-hendingar-dev.whitewave-5f5b53f5.swedencentral.azurecontainerapps.io/datasamling"
          } >> "$GITHUB_STEP_SUMMARY"
