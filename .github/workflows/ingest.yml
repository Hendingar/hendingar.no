name: Ingest now (dev)

# The nightly collection runs on Azure, not here: a Container Apps job on its own schedule
# (infra/ingest.bicep, ADR 0025). This workflow is the button for a run *now* — after merging an
# importer, say, rather than waiting for 05:00 UTC. It starts the same job the schedule starts and
# follows it to the end, so the run is red here when the night is.
#
# There is no dry run any more. A dry run against production was only ever a check that an
# importer maps cleanly, and `pnpm db:pull && pnpm ingest --dry-run` does that against a copy,
# without starting a container that holds the live database's password.
on:
  workflow_dispatch:

concurrency:
  group: ingest-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RG: rg-hendingar-swc-dev
  JOB: caj-hendingar-ingest-dev

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      # `workflow_dispatch` accepts any ref, but the job runs the image the last deploy of main
      # built — a branch cannot reach it from here. Refused anyway, so nobody believes otherwise.
      - name: Refuse to run from anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::The ingest job runs main's last deploy — this ref is $GITHUB_REF."
            echo "To try importer changes, run them locally against your own database:"
            echo "  pnpm db:pull && pnpm ingest --dry-run"
            exit 1
          fi

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Recorded as `schedule` on the job row: overriding INGEST_TRIGGER for one start replaces
      # the container's whole definition, secrets included. The page does not show the trigger.
      - name: Start the ingest job
        id: start
        run: |
          EXECUTION=$(az containerapp job start --name "$JOB" --resource-group "$RG" \
            --query name -o tsv)
          test -n "$EXECUTION" || { echo "::error::the job did not start"; exit 1; }
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
          echo "started $EXECUTION"

      # The job's own timeout is an hour (infra/ingest.bicep); this waits a little longer.
      - name: Follow it to the end
        run: |
          for i in $(seq 1 130); do
            STATUS=$(az containerapp job execution show --name "$JOB" --resource-group "$RG" \
              --job-execution-name "${{ steps.start.outputs.execution }}" \
              --query properties.status -o tsv)
            case "$STATUS" in
              Succeeded) echo "succeeded"; exit 0 ;;
              Failed|Stopped|Degraded)
                echo "::error::the night ended $STATUS — /datasamling names what failed"
                exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::still $STATUS after 65 minutes"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ingest now (dev)"
            echo ""
            echo "- Execution: \`${{ steps.start.outputs.execution }}\`"
            echo "- Logs: \`az containerapp job logs show -n $JOB -g $RG --execution ${{ steps.start.outputs.execution }} --container ingest\`"
            echo "- Status board: https://hendingar.no/datasamling"
          } >> "$GITHUB_STEP_SUMMARY"
