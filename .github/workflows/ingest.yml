name: Ingest (dev)

on:
  schedule:
    # 05:00 UTC daily — 07:00 in Norway during summer time, 06:00 in winter. Chosen so a run has
    # finished well before anyone is looking for what's on today.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Map and count without writing
        type: boolean
        default: false

concurrency:
  group: ingest-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RG: rg-hendingar-swc-dev

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Same guard as the deploy, and this one matters more.
      #
      # `schedule` always runs the default branch, but `workflow_dispatch` accepts any ref — so
      # without this, a branch's half-written mapper could be run against the PRODUCTION database
      # from a dropdown, writing real rows. The deploy at least passes through CI first; an ingest
      # writes immediately, and a bad upsert is not undone by redeploying.
      - name: Refuse to ingest from anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Ingest runs from main only — this ref is $GITHUB_REF."
            echo "To try importer changes, run them locally against your own database:"
            echo "  pnpm db:bootstrap && pnpm ingest --dry-run"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the database
        id: pg
        run: |
          FQDN=$(az postgres flexible-server list --resource-group "$RG" \
            --query "[0].fullyQualifiedDomainName" -o tsv)
          test -n "$FQDN" || { echo "::error::no Postgres server in $RG"; exit 1; }
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "server=${FQDN%%.*}" >> "$GITHUB_OUTPUT"

      # The firewall allows Azure services only, and a GitHub runner is not one.
      - name: Open firewall for this runner
        id: fw
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az postgres flexible-server firewall-rule create \
            --resource-group "$RG" --server-name "${{ steps.pg.outputs.server }}" \
            --name "gh-ingest-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" >/dev/null
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # Every importer, in one step, discovered rather than listed.
      #
      # This was fifteen near-identical steps, each naming one package. Adding a source meant
      # copying fifteen lines here and two more into package.json, and getting that wrong was easy
      # and quiet — deriving a step with a regex has twice produced two interleaved broken steps in
      # this repo. Now a package under importers/ IS the registration, and there is nothing here to
      # keep in step with it.
      #
      # --workspace-concurrency=4 runs four importers at once. Politeness is per host, and no two
      # packages share one — checked 2026-10-03: each talks to its own upstream, and `mec`, which
      # reads several sites, reads them one after another inside its own process. So no upstream
      # ever sees two of our requests at once, and allevents keeps its 10s crawl delay. It was 1,
      # which made the run the SUM of every importer; now it is about the slowest one, allevents,
      # at ~100s by design. Measured locally on 2026-10-03, same data: 156s sequential, 105s at 4.
      # --stream prefixes every line with its package, so the log still reads per source.
      #
      # --no-bail is the flag that matters. The chain was `a && b && c`, so the first failure
      # stopped every importer after it: on 2026-09-06 allevents.in rate-limited us and six
      # perfectly healthy sources simply did not run, with nothing on /kjelder to say why. Now each
      # reports its own ingest_runs row and a failure costs only itself. pnpm still exits non-zero
      # if any of them failed, so the job still goes red.
      - name: Ingest every source
        if: always() && steps.fw.outputs.opened == 'true'
        env:
          PGHOST: ${{ steps.pg.outputs.fqdn }}
          # As environment, never pasted into the script: a quote in the value would be shell.
          PW: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          INGEST_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DATABASE_URL=$(python3 -c \
            'import os,urllib.parse as u; print("postgres://hendingar:%s@%s:5432/hendingar?sslmode=require" % (u.quote(os.environ["PW"], safe=""), os.environ["PGHOST"]))')
          export DATABASE_URL
          if [ "$DRY_RUN" = "true" ]; then
            pnpm run ingest -- --dry-run | tee -a result.txt
          else
            pnpm run ingest | tee -a result.txt
          fi

      # Submissions nobody came back to fix. Runs on the same schedule because it needs a database
      # and nothing else, and a retention policy that runs when somebody remembers is not one.
      - name: Expire abandoned submissions
        if: always() && steps.fw.outputs.opened == 'true' && inputs.dry_run != true
        env:
          PGHOST: ${{ steps.pg.outputs.fqdn }}
          # As environment, never pasted into the script: a quote in the value would be shell.
          PW: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          DATABASE_URL=$(python3 -c \
            'import os,urllib.parse as u; print("postgres://hendingar:%s@%s:5432/hendingar?sslmode=require" % (u.quote(os.environ["PW"], safe=""), os.environ["PGHOST"]))')
          export DATABASE_URL
          pnpm expire | tee -a result.txt

      # After every importer, never inside one: an importer sees a single source and cannot know
      # what the others said. Skipped on a dry run, which must write nothing.
      - name: Consolidate duplicates across sources
        if: always() && steps.fw.outputs.opened == 'true' && inputs.dry_run != true
        env:
          PGHOST: ${{ steps.pg.outputs.fqdn }}
          # As environment, never pasted into the script: a quote in the value would be shell.
          PW: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          DATABASE_URL=$(python3 -c \
            'import os,urllib.parse as u; print("postgres://hendingar:%s@%s:5432/hendingar?sslmode=require" % (u.quote(os.environ["PW"], safe=""), os.environ["PGHOST"]))')
          export DATABASE_URL
          pnpm consolidate | tee -a result.txt

      # The weekend's picks, chosen after the rows they are chosen from exist.
      #
      # Last, and deliberately: it must run after `consolidate`, or the kurator can pick two rows
      # that are the same event reported by two sources and offer them as two of its three.
      #
      # A curl rather than a script, because the model lives somewhere this runner cannot reach.
      # The verifier's ingress is internal (infra/verifier.bicep, `external: false`) so that an
      # unauthenticated /extract cannot become a public vision-model proxy, and this runner is
      # outside the Container Apps environment entirely — it gets to Postgres only through the
      # firewall rule above. The app is inside, so the app makes the call and we ask the app.
      #
      # `continue-on-error`: a weekend without picks is a page that renders exactly as it did
      # before the kurator existed. Failing the ingest over it would turn an optional section into
      # a red build about fifteen sources that imported perfectly.
      - name: Curate the weekend
        if: always() && inputs.dry_run != true
        continue-on-error: true
        run: |
          APP=$(az containerapp show --resource-group "$RG" --name ca-hendingar-dev \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          test -n "$APP" || { echo "::warning::no app ingress found; skipping curation"; exit 0; }
          # Idempotent per day: a second POST returns the stored picks without calling a model, so
          # a re-run costs nothing and cannot produce a second, different selection.
          #
          # The Origin header is not decoration. SvelteKit refuses a cross-origin POST, and a curl
          # sends no Origin at all — without this the nightly call is a 403 that nobody reads,
          # because this step is continue-on-error. `app/e2e/kurator.e2e.ts` asserts both halves.
          curl -fsS -X POST -H "Origin: https://$APP" "https://$APP/api/kurator" | tee -a result.txt
          echo >> result.txt

      # A separate always() step: a bash EXIT trap does not survive SIGKILL, and a leaked rule
      # leaves a recycled public runner IP allowed against the database.
      - name: Close firewall
        if: always() && steps.fw.outputs.opened == 'true'
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RG" --server-name "${{ steps.pg.outputs.server }}" \
            --name "gh-ingest-${{ github.run_id }}" --yes >/dev/null 2>&1 || true
          for stale in $(az postgres flexible-server firewall-rule list \
                --resource-group "$RG" --server-name "${{ steps.pg.outputs.server }}" \
                --query "[?starts_with(name,'gh-ingest-')].name" -o tsv); do
            az postgres flexible-server firewall-rule delete \
              --resource-group "$RG" --server-name "${{ steps.pg.outputs.server }}" \
              --name "$stale" --yes >/dev/null 2>&1 || true
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ingest (dev)"
            echo ""
            echo '```'
            cat result.txt 2>/dev/null || echo "no result — the run did not reach the importer"
            echo '```'
            echo ""
            echo "Status board: https://ca-hendingar-dev.whitewave-5f5b53f5.swedencentral.azurecontainerapps.io/datasamling"
          } >> "$GITHUB_STEP_SUMMARY"
