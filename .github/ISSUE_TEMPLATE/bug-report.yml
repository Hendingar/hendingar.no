name: 🐛 Bug report
description: Something is broken or wrong.
title: 'bug: <short description>'
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. …
  - type: input
    id: url
    attributes:
      label: URL or event affected
  - type: input
    id: env
    attributes:
      label: Browser / device
