<!DOCTYPE html><html lang="no"><head><title>Hendingar — Bømlo Næringsråd</title></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"events": [{"id": "cmtjs5wzi0qmd07ulk09ubdd1", "slug": "heim-igjen-2026", "name": "Heim igjen 2026", "starttime": "2026-12-22T17:30:00+00:00", "endtime": "2026-12-22T22:00:00+00:00", "host": {"name": "Bømlo Kulturhus", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/ZnITbUvCQrWybWxlV4yb"}}}, "about": {"markdown": "Me inviterer igjen til Heim igjen - Bømlo!\n\nEr du bømling som studerer eller jobbar vekke, eller som snart skal ut og studere? Vurderer du kanskje å flytte til Bømlo? Eller har du nyleg flytta til Bømlo og er på leit etter jobb?\n\nMe har laga til ein møteplass for nettopp deg, der du kan få møte bedrifter som held til i området, og kanskje finne din framtidige arbeidsstad.\n\nPå denne samlinga på får du møte bedrifter og andre i samme situasjon som deg. Me vil og fortelje litt om korleis det er å bu på Bømlo, og kva ein kan finne på når ein er ferdig på jobb. Meir info om kven du får møte kjem fortløpande!\n\nDet vert servert god mat og drikke, og arrangementet har difor 18 års aldersgrense.\n\nStad: Bømlo Kulturhus  \nTidspunkt: 22. desember, dørene opnar 18.30 og arrangementet startar 19.00  \nPris: Gratis  \nPåmelding: [Meld deg på her!](https://forms.cloud.microsoft/e/rVnPEwXdSs \"https://forms.cloud.microsoft/e/rVnPEwXdSs\") Frist 17. desember.\n\n_Dette arrangementet er ikkje retta mot dei som allereie jobbar i nokon av medlemsbedriftene våre._\n"}}, {"id": "cmfzax2rjuy1s07tbmc3pejc7", "slug": "heim-igjen-2025", "name": "Heim igjen - Bømlo 2025", "starttime": "2025-12-22T17:30:00+00:00", "endtime": "2025-12-22T22:00:00+00:00", "host": null, "about": {"markdown": "Me inviterer igjen til Heim igjen - Bømlo!\n\nEr du bømling som studerer eller jobbar vekke, eller som snart skal ut og studere? Vurderer du kanskje å flytte til Bømlo? Eller har du nyleg flytta til Bømlo og er på leit etter jobb?\n\nMe har laga til ein møteplass for nettopp deg, der du kan få møte bedrifter som held til i området, og kanskje finne din framtidige arbeidsstad.\n\nPå denne samlinga på får du møte bedrifter og andre i samme situasjon som deg. Me vil og fortelje litt om korleis det er å bu på Bømlo, og kva ein kan finne på når ein er ferdig på jobb. Meir info om kven du får møte kjem fortløpande!\n\nDet vert servert god mat og drikke, og arrangementet har difor 18 års aldersgrense.\n\nStad: Bømlo Kulturhus  \nTidspunkt: 22. desember, dørene opnar 18.30 og arrangementet startar 19.00  \nPris: Gratis  \nPåmelding: [https://forms.office.com/e/k2BsKgP3b8](https://forms.office.com/e/k2BsKgP3b8 \"https://forms.office.com/e/k2BsKgP3b8\")\n\n_Dette arrangementet er ikkje retta mot dei som allereie jobbar i nokon av medlemsbedriftene våre._\n"}}, {"id": "cmadsw5ewf0ui07umeo2csafm", "slug": "valkampmobilisering-i-moster-amfi", "name": "Valkampmobilisering i Moster Amfi", "starttime": "2025-06-14T09:00:00+00:00", "endtime": "2025-06-14T15:00:00+00:00", "host": null, "about": {"markdown": "**Velkomen til Valkampmobilisering – i Moster Amfi- og kyrkjehistoriske senter, laurdag 14. juni 2025!**\n\nI samband med «Valkampmobilisering» fram mot stortingsvalet hausten 2025, er alle politiske parti i Sunnhordland klar til å ha stand i Moster Amfi 14. juni 2025.\n\nPartia er oppmoda til å invitere sine politiske representantar som står på val i 2025 til å vere med å delta i debattane denne dagen.  \nAlle partia er representerte i svalgangen i Moster Amfi. Der kan du prata og diskutera med representantane frå dei ulike partia om viktige saker og spørsmål.\n\nDagen er spekka med gratis underhaldning for store og små!  \nMorild - Barnemusikkfestival opnar med barnekonsert på hellene framfor scena i uteamfiet. Kaféen i amfiet vil vere open under heile arrangementet.  \nDet er blir foredrag og debattar og Erik Wold stiller som moderator/ debattleiar.\n\n**Tentativt program:**  \n11:00  \nDørene opnar\n\n12-12:45:  \nMorild – Barnemusikkfestival  \n- Trio Tunnel - Endre Olsen, Roald Kaldestad og Jørgen Sandvik (Knutsen og Ludvigsen låtar)  \n- Morild organiserer leikar, loddsal og ansiktsmaling for ungar  \nPolitiske debattar: Erik Wold stiller som moderator/ debattleiar\n\n13:00-14:00  \nSamtale: Psykisk helse/ inkludering/ utenforskap  \n- Innlegg: Bjarte Tjensvoll Notland (AuF Bømlo) Bømlo ungdomsråd  \n- Rikspolitiske representanter:  \no Partia vert utfordra på å stille med relevante reprentantar  \no Førebel bekrefta: Aleksander Papas (Sv)\n\n14:30-15:30:  \nInnlegg frå initiativ Vestland – Mathias Fisher (ikkje endeleg bekrefta)  \nDebatt: Korleis set me Vestlandet på kartet i den kommande 4-årsperioden?  \no Partia er utfordra på å stille med relevante reprentantar  \no Førebel bekrefta: Liv Kari Eskeland (H), Odd Harald Hovland (Ap), Simon Nesse Økland (Bremnes Seashore), Øyvind Halleraker (Stavanger2Bergen), Arne Hammer (Aker Solutions),\n\nKl.16:00-17:00:  \nForedrag og vidare debatt: Norge i globalt perspektiv (sikkerheit/ beredskap) - Hilmar Mjelde (HVL)  \nDebatt med nasjonale politikarar\n\nArrangementet er gratis.\n\n_Arr:  \nMoster Amfi- og kyrkjehistoriske senter  \nMorild_\n"}}, {"id": "cmp3xn6aolcg606uj5vq19nye", "slug": "bomlakonferansen-2026", "name": "Bømlakonferansen 2026", "starttime": "2026-09-17T08:00:00+00:00", "endtime": "2026-09-17T14:00:00+00:00", "host": {"name": "Bømlo Kulturhus", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/ZnITbUvCQrWybWxlV4yb"}}}, "about": {"markdown": "Velkommen til årets Bømlakonferanse, som går av stabelen 17. september 2026. Arrangementet er sponsa av Sparebanken Norge.\n\nPåmelding her: [Påmelding Bømlakonferansen 2026 – Fyll ut skjema](https://forms.cloud.microsoft/e/PGfH7ed0jp \"https://forms.cloud.microsoft/e/PGfH7ed0jp\")\n\n| Program         |                                 |                                                                           |\n| --------------- | ------------------------------- | ------------------------------------------------------------------------- |\n| 09:30           | Registrering av deltakarar      |                                                                           |\n| 10:00           | Skatt i verda                   |                                                                           |\n|                 | Velkommen til konferanse        | v/ dagleg leiar Ragnfrid Sønstabø og konferansier Johannes Nilsen Stusvik |\n|                 | Trump versjon 2.0               | v/ USA-ekspert ved HVL Hilmar Mjelde                                      |\n|                 | Økonomiske utsikter             | v/ Analysesjef i Norne Securities Petter Slyngstadli                      |\n| _11:15_         | _Pause med kaffi og noko godt_  |                                                                           |\n| 11:35           | Skatt frå alle kantar           |                                                                           |\n|                 | Heim igjen                      | v/ Selma og Bjarte                                                        |\n|                 | Skattefunn i trapperingen       | v/ dagleg leiar Berner Elias Innvær                                       |\n|                 | Livepod                         | v/ CEO i Eidesvik Offshore Helga Cotgrove og podvert Kjetil Fyllingen     |\n| _12:30 - 13:30_ | _LUNSJ_                         |                                                                           |\n| 13:30           | Lokale skattar                  |                                                                           |\n|                 | Zinus                           | v/ sals- og marknadssjef Bjørn Sturle Hillestad                           |\n|                 | Moster Amfi                     | v/ dagleg leiar Marco Thomas                                              |\n|                 | Nourish                         | v/ gründer Anja Hope                                                      |\n|                 | Scale Aq                        | v/ Ståle Ytrøy                                                            |\n| 14:40           | _Pause med kaffi og noko godt_  |                                                                           |\n| 15:00           | Den største skatten             |                                                                           |\n|                 | Leiing i kriser                 | v/ professor ved UiB Olav Olsen                                           |\n|                 | Avslutning                      | v/ dagleg leiar i Atheno Astrid Kjellevold                                |\n| 16.00           | _Dagsprogram slutt_             |                                                                           |\n| 16.30           | Kveldsprogram med mat og musikk | Musikk frå Roger Stangervåg og 3-retters frå Kulleseidkanalen Gjestehamn  |\n\n\n"}}, {"id": "cmq585l4n4pau07utwofpc9pl", "slug": "frukostmote-siemens-energy", "name": "Frukostmøte hos Siemens Energy ", "starttime": "2026-08-18T06:00:00+00:00", "endtime": "2026-06-18T08:00:00+00:00", "host": {"name": "Siemens Energy", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/BFJrhmDZTfKkvOgCFpal"}}}, "about": {"markdown": "Siemens Energy AS inviterer til frukostmøte i deira lokaler på Ternetangen. Dette er ein unik moglegheit til å bli betre kjend med denne spanande produksjonsbedrifta som utviklar, kvalifiserer, produserer og leverer produkt til heile verda.\n\nMeld deg på allereie no til ragnfrid@bomlonr.no. Påmeldingsfrist mandag 17. august.\n"}}, {"id": "cmm207dq48tzm07uk8egwq23t", "slug": "lunsjmote-om-vestlandsindeksen", "name": "Lunsjmøte med Sparebanken Norge om Vestlandsindeksen", "starttime": "2026-06-08T10:00:00+00:00", "endtime": "2026-06-08T11:30:00+00:00", "host": {"name": "Bømlo Hotell", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/cmkuz9angb12u07usd9ymgub4"}}}, "about": {"markdown": "**Velkommen til lunsj på Bømlo Hotell, med presentasjon av Næringsindeksen 2. kvartal 2026!**  \n  \nValuta- og rentemeklar [Remy Atle Bilsback](https://www.linkedin.com/in/remy-bilsback-4a1a131b0/ \"https://www.linkedin.com/in/remy-bilsback-4a1a131b0/\") kjem tilbake til oss for å presentere den rykande ferske Næringsindeksen (Vestlandsindeksen). Næringsindeksen er ein kvartalsvis temperaturmålar for norsk næringsliv. Indeksen kartlegg utviklinga i sentrale indikatorar som etterspurnad, lønsemd, investeringar og sysselsetjing.\n\n![Remy.png](https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/cmm205v5v823507t627yu8rbl \"Remy.png\")\n\nRemy vil i tillegg kaste eit skråblikk på politiske strøymingar og effekta desse kan ha på rente- og valutautviklinga.\n\nLunsj vert servert av Bralunsj.\n\nPåmelding til ragnfrid@bomlonr.no innan torsdag 4. juni.\n"}}, {"id": "cmtjsd6x414bu07ulm8znk3ti", "slug": "frukostmote-og-omvisning-hos-viergo", "name": "Frukostmøte og omvisning hos Viergo", "starttime": "2026-11-10T07:00:00+00:00", "endtime": "2026-11-10T09:00:00+00:00", "host": {"name": "Viergo ", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/cDi2rMmpR3y7MOq2OISI"}}}, "about": {"markdown": "Viergo inviterer til frukostmøte i deira nyrenoverte lokaler. Her vert det servert god mat frå dei flinke folka på Viergo, før me får ein presentasjon frå ny dagleg leiar av bedrifta og ein omvisning rundt i dei nye lokalene deira.\n\nProgram:\n\n-   08.00-08.05: Velkommen v/Ragnfrid Sønstabø\n-   08.05-08.35: Frukost og mingling\n-   08.35-09.00: Presentasjon av Viergo v/dagleg leiar Johanne Dybvik Helland\n-   09.00-09.45: Omvisning\n\nPåmelding til ragnfrid@bomlonr.no innan 6. november.\n"}}, {"id": "cmtb9tqv18gtv06ukm6s0htya", "slug": "frukostmote-om-tryggleik-og-beredskap", "name": "Frukostmøte om tryggleik og beredskap", "starttime": "2026-10-22T06:00:00+00:00", "endtime": "2026-10-22T08:00:00+00:00", "host": {"name": "Finnås Kraftlag", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/CtCUGHTPSRyD86QE8WZl"}}}, "about": {"markdown": "**Frukostmøte hos Finnås Kraftlag i Hollundsdalen, i samarbeid med Haugaland Kraft og Fagne, om tryggleik og beredskap i ei meir uroleg tid**\n\nVi lever i ei stadig meir uforutsigbar verd. Geopolitiske spenningar, digitale truslar og meir ekstremvêr stiller aukande krav til tryggleik og beredskap, også lokalt. Kraft- og digital infrastruktur er mellom dei mest samfunnskritiske funksjonane vi har. Når straum og fiber er stabile, fungerer både næringslivet, kommunane og kvardagen vår slik dei skal.\n\nPå frukostmøtet deler Haugaland Kraft innsikt og erfaringar frå arbeidet med tryggleik og beredskap. Vi ser nærare på verdien av gode tryggingstiltak, korleis nettselskapet arbeider for å sikre straumforsyninga lokalt, og kvifor digital tryggleik og robuste fibernett er avgjerande for næringslivet. I tillegg blir forskingsprosjektet B-READY presentert. Prosjektet viser korleis batteriløysingar kan bidra til både grøn omstilling og styrkt beredskap i straumnettet.\n\n**Du vil få høyre innlegg frå:**\n\n-   Tore Skogøy, IT-sjef i Haugaland Kraft  \n    _Korleis tilpasse seg ei ny digital tid? – verknaden av gode tryggingstiltak_\n-   Aksel Sæther, bedriftsrådgjevar, og Jone Tonning, nettverksingeniør for teknisk tryggleik og beredskap i Haugaland Kraft Fiber  \n    _Digital tryggleik og robust infrastruktur – kva betyr det for næringslivet?_\n-   Joacim Strand Haraldseid, risikorådgjevar og beredskapskoordinator i nettselskapet Fagne  \n    _Tryggleik og beredskap i den regionale kraftforsyninga_\n-   Espen Nordtveit, prosjektutviklar i solkraftselskapet Endra  \n    _B-READY: Auka beredskap i straumnettet med batteriløysingar_\n\n****\n\n**Program**\n\n| 08.00–08.25 | Frukost og mingling                                                      |\n| ----------- | ------------------------------------------------------------------------ |\n| 08.25–08.35 | Velkomen til frukostmøte v/Tor Bjarne Smedsrud, Adm. dir Finnås Kraftlag |\n| 08.35-09.45 | Faglege innlegg frå Haugaland Kraft, Fagne og Endra                      |\n| 09.45-09.55 | Spørsmål og svar                                                         |\n| 09.55-10.00 | Avslutning v/Ragnfrid Sønstabø, Bømlo Næringsråd                         |\n\nMeld deg på til ragnfrid@bomlonr.no innan fredag 16. oktober.\n"}}, {"id": "cmn61fql777m907uswztyj0c6", "slug": "frukostmote-med-matre-maskin-servogear-og-stord-lufhamn", "name": "Frukostmøte med Matre Maskin, Servogear og Stord Lufhamn", "starttime": "2026-04-21T06:00:00+00:00", "endtime": "2026-04-21T08:00:00+00:00", "host": {"name": "Matre Maskin", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/NXuOhB8ZR4qmQ6PI9BqX"}}}, "about": {"markdown": "Næringsrådet har ein serie med frukostmøter som me kalla for «Ka bala du med?». Her går tre bedrifter saman, for å fortelje om det dei driv med. Denne gongen er det Matre Maskin, Servogear og Stord Lufthamn som vil presentere seg. Frukostmøtet finn stad i kantina på Matre Maskin i Brubakken.\n\n**Bedriftene:**\n\nMatre er ein leiande produsent av avansert brannslukkingsutstyr for å trygge kritisk infrastruktur, blant anna helikopterdekk på offshore-installasjonar, båt og sjukehus. Høyr om korleis dei frå Rubbestadneset leverer både produkt og system over heile verda.\n\nServogear er ein verdsleiande produsent og leverandør av vribare propellar og girboksar. På frukostmøte vil dei fortelje om korleis Servogear er organisert, kva dei kan levere og til kven.\n\nStord Lufthamn kjem for å gi ei kort oppdatering om status og utvikling ved Stord lufthamn og DAT, med særleg fokus på beredskap, nye ruteanbod og sommarruter mellom Stord og Oslo. I tillegg vil dei seie litt om konkurransesituasjonen mot Haugesund og samfunnseffektane av lufthamna.\n\n**Program:**\n\n-   Frukostservering\n-   Velkommen og kort status frå næringsrådet\n-   Matre Maskin v/dagleg leiar Tommy Esperø\n-   Servogear v/dagleg leiar Anita Alsaker + Lars Hovland på prosjekt og Malvin Teigland på Service\n-   Stord Lufthamn v/lufthamnsjef Jan Morten Myklebust\n\nPåmelding innan 13. april til post@bomlonr.no.\n\nSamlinga er for medlemmar i Bømlo Næringsråd, og det er begrensa med plassar. Så ver rask å melde deg på!\n"}}, {"id": "cmn64pqr3chf607us5tv76j0h", "slug": "skjaergardscruise-med-ms-ga-pa-i-regi-av-dnb", "name": "Skjærgårdscruise med MS Gå På i samarbeid med DNB og Atheno", "starttime": "2026-05-28T12:00:00+00:00", "endtime": "2026-05-28T16:00:00+00:00", "host": {"name": "DNB", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/NKpUTq6LThGBwEkmKpXk"}}}, "about": {"markdown": "DNB og Atheno inviterer, i samarbeid med Bømlo Næringsråd, til ein hyggeleg skjærgårdstur i øyriket rundt Søra Bømlo.\n\nDet blir korte og inspirerande innlegg der Audun Kolstad Wiig fra DNB deler sine perspektiv på den geopolitiske turbulensen, Lena Hetland Grønsberg fra DNB Carnegie gir oss ei oppdatering på dei økonomiske utsiktene. Astrid Kjellvold fra Atheno seier noko om utfordringar og moglegheiter som regionen vil stå overfor i åra som kjem.\n\n**Informasjon  \n**Servering: Det blir servert smakfull fiskesuppe  \nOmbordstigning: Bømlahamnvegen 154, Langevåg  \nDato: Torsdag 28. mai  \nTid: 14:00 - 18:00\n\n**Påmelding**  \nDet er begrensa antal plassar, og maks påmelding per bedrift er to personar. Påmeldingsfrist: 15. mai. Arrangementet er gratis. [Meld deg på her!](https://bc.dnb.no/campaign/site/share/43715 \"https://bc.dnb.no/campaign/site/share/43715\")  \n  \nTa kontakt med Ragnfrid Sønstabø i Bømlo Næringsråd på [ragnfrid@bomlonr.no](mailto:ragnfrid@bomlonr.no \"mailto:ragnfrid@bomlonr.no\") om du ynskjer transport t/r Svortland-Langevåg (betales av den enkelte).  \n  \nMe håpar du vil bli med oss på ein sosial og fagleg inspirerande ettermiddag på sjøen.\n\nMed venleg helsing, DNB, Atheno & Bømlo Næringsråd\n"}}, {"id": "cmkciayzq0tjs07tbmefv0vdt", "slug": "arsmote-og-arsfest-2025", "name": "Årsmøte og Årsfest 2025 for medlemmer i Bømlo Næringsråd", "starttime": "2026-03-26T17:00:00+00:00", "endtime": "2026-03-26T22:00:00+00:00", "host": {"name": "Kulleseidkanalen Gjestehamn", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/Ntty7HUwTGDl1Ch9C8Y8"}}}, "about": {"markdown": "**Årsmøte**\n\nÅrsmøte vert i år som i fjor gjennomført på Kulleseidkanalen Gjestehavn frå kl 18-19.\n\n**Årsfesten**\n\nLike etter årsmøte går me rett over til årsfest med ein tre-retters middag, der det mellom anna vert utdeling av Næringsprisen 2025. Bandet Feik spelar og nord norges friskeste foredragshaldar Malin Arntsen kjem å held foredrag for oss, sjå vedlagt plakat, og les meir på[_https://begeistrer.no_](https://begeistrer.no/ \"Begeistrer\")\n\n**Pris for deltaking**\n\n-   ⁠Årsmøte: Gratis.\n-   ⁠Årsfesten: Pris for å delta på årsfestsen er 690 kr + mva. og inkluderer mat og underhaldning. Ein handlar det ein vil drikke sjølv over disk.\n\n**Meny**\n\n-   Forrett: Skalldyrsuppe\n-   Hovudrett: Innbakt laks Wellington\n-   Dessert: Tiramisu\n\n**⁠Sponsorar**  \nÅrsmøtet/⁠⁠Årsfesten er sponsa av Fylkesnes Fisk.\n\n**Påmelding**  \nPåmelding til post@bomlonr.no innan 19. mars. Skriv om du kjem på årsmøtet, årsfesten eller begge deler, og ev. allergiar. Grunna matservering er påmeldinga til årsfesten er bindane.\n\n**Dokumenter**  \nÅrsmøtedokumenter vert sendt ut til medlemmar seinast ei veke før årsmøtet.\n"}}, {"id": "cmkmj018p24z30dunpy3r3txj", "slug": "styrekurs-del-1-i-regi-av-atheno", "name": "Styrekurs del 1- i regi av Atheno", "starttime": "2026-03-12T08:00:00+00:00", "endtime": "2026-03-12T13:00:00+00:00", "host": {"name": "Atheno ", "generalInformation": {"logo": {"url": "https://eu-central-1.graphassets.com/A6YG0xeyST1i6BuQvn6Xlz/QSiUxdQJGTdQWqguddKw"}}}, "about": {"markdown": "Atheno arrangerer nytt kurs i praktisk styrearbeid torsdag ​12. mars 2026. Kurset høver både for ferske styremedlemmer og styremedlemmer som har ein del erfaring, men som ynskjer eit oppfriska blikk på sitt arbeid som styremedlem eller styreleiar.\n\nKurset tek utgangspunkt i aksjeselskapsforma, men er relevant for andre typar føretak.\n\nFor meir informasjon - __[Styrekurs del 1 - 12 mars – Atheno](https://atheno.no/arrangement/styrekurs-del-1-12-mars/ \"https://atheno.no/arrangement/styrekurs-del-1-12-mars/\")\n\nDet vil verta arrangert nytt styrekurs del 2 med fokus på økonomi og økonomiforståing for aksjeselskap i løpet av våren. Meir informasjon kjem.\n\n\n\n__\n"}}], "businesses": [], "navigations": []}}, "page": "/hendingar", "buildId": "WxPNMD91QDxLrcFczFR57", "isFallback": false}</script></body></html>
