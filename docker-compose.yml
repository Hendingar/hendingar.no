# One command to a known-good database:
#   docker compose up -d && pnpm db:reset && pnpm db:seed
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: hendingar
      POSTGRES_PASSWORD: hendingar
      POSTGRES_DB: hendingar
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hendingar -d hendingar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
